# Keksdose – statische Seite, kein Build-Schritt nötig.
# Netlify veröffentlicht einfach den Inhalt von public/.

[build]
  command = ""
  publish = "public"

[[headers]]
  for = "/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# Netlify kennt die Endung .webmanifest nicht und liefert sonst octet-stream.
[[headers]]
  for = "/manifest.webmanifest"
  [headers.values]
    Content-Type = "application/manifest+json"
    Cache-Control = "public, max-age=0, must-revalidate"
