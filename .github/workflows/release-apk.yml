name: Android-APK ans Release hängen

# Die APK wird lokal mit ./android/build.sh gebaut und geprüft. Dieser Job
# prüft die Prüfsumme der abgelegten Datei und hängt sie an das Release.
on:
  push:
    branches: [main]
    paths:
      - 'public/downloads/**'
      - '.github/workflows/release-apk.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  attach:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Prüfsumme kontrollieren
        run: cd public/downloads && sha256sum -c SHA256SUMS

      - name: APK an das Release hängen
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: v1.0.3
          APK: public/downloads/Keksdose-1.0.3.apk
        run: |
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" --title "Keksdose 1.0.3 – Android-App" \
              --notes "Website-Fassung mit genaueren Gebäcks-Motiven: Pancakes, Muffins, Buchteln, Zimtschnecken, Palmiers, Streuselkuchen, Krapfen und Waffeln haben eigene Illustrationen statt geliehener Keksformen."
          fi
          gh release upload "$TAG" "$APK" --clobber
          gh release view "$TAG" --json assets --jq '.assets[].name'
